[project]
name = "awesome-mcp-security-server"
version = "0.1.0"
description = "Read-only MCP server that makes the Awesome Agentic MCP Security list searchable from MCP clients."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
awesome-mcp-security = "awesome_mcp_security.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_mcp_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
