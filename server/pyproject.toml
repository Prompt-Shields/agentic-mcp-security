[project]
name = "awesome-mcp-security-server"
version = "0.1.0"
description = "Read-only MCP server that makes the Awesome Agentic MCP Security list searchable from MCP clients."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]
keywords = ["mcp", "model-context-protocol", "security", "agentic-ai", "awesome-list", "cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Prompt-Shields/agentic-mcp-security/tree/main/server"
Repository = "https://github.com/Prompt-Shields/agentic-mcp-security"
Issues = "https://github.com/Prompt-Shields/agentic-mcp-security/issues"

[project.scripts]
awesome-mcp-security = "awesome_mcp_security.server:main"
# Same entry point under the package's own name, so `uvx awesome-mcp-security-server` works
# (that is how MCP Registry clients start a PyPI server).
awesome-mcp-security-server = "awesome_mcp_security.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_mcp_security"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md", "server.json"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
